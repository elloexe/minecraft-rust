[package]
name = "claudium-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Claudium simulation foundations for the pinned vanilla Java Edition target"

[features]
# Records the call sites of LegacyRandom draws (mob AI parity debugging).
rng-trace = []

[dependencies]
libm = "=0.2.16"

[[bin]]
name = "claudium-parity"
path = "src/bin/parity.rs"

[[bin]]
name = "claudium-tick-parity"
path = "src/bin/tick_parity.rs"

[[bin]]
name = "claudium-geometry-parity"
path = "src/bin/geometry_parity.rs"

[[bin]]
name = "claudium-noise-parity"
path = "src/bin/noise_parity.rs"

[[bin]]
name = "claudium-density-parity"
path = "src/bin/density_parity.rs"

[[bin]]
name = "claudium-float-log-parity"
path = "src/bin/float_log_parity.rs"

[lints]
workspace = true
