name: electron launcher
# Builds the Electron launcher's Windows installer (Claudium-Launcher-Setup.exe).
# Set the repository variable CLAUDIUM_MSA_CLIENT_ID to override the default public sign-in id.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "launcher-electron/**"
      - ".github/workflows/electron-launcher.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: electron-launcher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: launcher-electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build installer
        run: npm run dist:win
      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          cp dist/*.exe out/ 2>/dev/null || true
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: claudium-launcher-electron-windows
          path: launcher-electron/out/*.exe
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: launcher-electron/out/*.exe
