name: electron launcher
# Builds ONE self-contained Windows installer: Claudium-Launcher-Setup.exe. It bundles both the
# Rust launcher engine (claudium-launcher, which owns sign-in/prepare/play) and the game itself
# (claudium-client + tools), so installing the launcher installs the game — nothing is downloaded
# at run time, and it works with the repo private. First Play installs the bundled game locally
# (claudium-launcher install <ver> --from <bundled>) and prepares it from the player's own Minecraft.
#
# Set the repository variable CLAUDIUM_MSA_CLIENT_ID to override the default public sign-in id.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "launcher-electron/**"
      - "launcher/**"
      - "crates/**"
      - "research-lock.json"
      - "Cargo.lock"
      - ".github/workflows/electron-launcher.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: electron-launcher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # The launcher engine is its own Cargo workspace; the game is the root workspace. Cache each.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
          shared-key: launcher-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: game-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # 1) The engine (claudium-launcher): sign-in, local install, prepare, play.
      - name: Build the engine
        working-directory: launcher
        env:
          CLAUDIUM_MSA_CLIENT_ID: ${{ vars.CLAUDIUM_MSA_CLIENT_ID }}
        run: cargo build --release --locked --bin claudium-launcher

      # 2) The game (claudium-client) and its tools (claudium-ctl, claudium-prepare).
      - name: Build the game
        run: cargo build --release --locked -p claudium-client -p claudium-prepare --bins

      # 3) Stage both into the Electron app so electron-builder bundles them as extraResources.
      - name: Stage engine and game
        shell: bash
        run: |
          set -e
          mkdir -p launcher-electron/bin launcher-electron/game
          cp launcher/target/release/claudium-launcher.exe launcher-electron/bin/claudium-launcher.exe
          cp target/release/claudium-client.exe  launcher-electron/game/claudium-client.exe
          cp target/release/claudium-ctl.exe     launcher-electron/game/claudium-ctl.exe
          cp target/release/claudium-prepare.exe launcher-electron/game/claudium-prepare.exe
          cp research-lock.json                  launcher-electron/game/research-lock.json
          ls -l launcher-electron/bin launcher-electron/game

      # 4) Bundle a Java JDK so preparing the game needs no Java install and no Mojang download.
      #    research-lock.json pins java_major (25); Temurin (Adoptium) ships that as a redistributable
      #    OpenJDK build. Flattened so launcher-electron/jdk/bin/javac.exe exists.
      - name: Bundle a JDK
        shell: bash
        run: |
          set -e
          major=$(sed -n 's/.*"java_major": *\([0-9]*\).*/\1/p' research-lock.json | head -1)
          major=${major:-25}
          url="https://api.adoptium.net/v3/binary/latest/${major}/ga/windows/x64/jdk/hotspot/normal/eclipse?project=jdk"
          echo "Downloading Temurin JDK ${major} for Windows x64"
          curl -fL --retry 4 --retry-delay 5 "$url" -o jdk.zip
          mkdir -p jdk-extract
          tar -xf jdk.zip -C jdk-extract
          inner=$(ls -d jdk-extract/*/ | head -1)
          mkdir -p launcher-electron/jdk
          cp -r "${inner}." launcher-electron/jdk/
          test -f launcher-electron/jdk/bin/javac.exe
          echo "JDK staged:"; launcher-electron/jdk/bin/javac.exe -version

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install electron deps
        working-directory: launcher-electron
        run: npm install --no-audit --no-fund
      - name: Build installer
        working-directory: launcher-electron
        env:
          CLAUDIUM_MSA_CLIENT_ID: ${{ vars.CLAUDIUM_MSA_CLIENT_ID }}
        run: npm run dist:win
      - name: Collect the single installer
        shell: bash
        working-directory: launcher-electron
        run: |
          mkdir -p out
          cp dist/*.exe out/ 2>/dev/null || true
          ls -l out

      # The ONLY user-facing download: the installer. No internal build chunks.
      - uses: actions/upload-artifact@v4
        with:
          name: Claudium-Launcher-Setup
          path: launcher-electron/out/*.exe
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: launcher-electron/out/*.exe
