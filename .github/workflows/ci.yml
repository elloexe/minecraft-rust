name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev
      - run: cargo test --release --verbose
      - run: cargo build --release

  build:
    name: build (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: ".exe"
            label: windows
          - os: macos-latest
            suffix: ""
            label: macos
          - os: ubuntu-latest
            suffix: ""
            label: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev
      - run: cargo build --release
      - name: Collect binaries
        shell: bash
        run: |
          mkdir dist
          cp "target/release/claudium${{ matrix.suffix }}" "dist/claudium-${{ matrix.label }}${{ matrix.suffix }}"
          cp "target/release/claudium-launcher${{ matrix.suffix }}" "dist/claudium-launcher-${{ matrix.label }}${{ matrix.suffix }}"
      - uses: actions/upload-artifact@v4
        with:
          name: claudium-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
      - name: Attach binaries to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
