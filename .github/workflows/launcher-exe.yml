name: launcher exe
# Builds claudium-launcher.exe on a Windows runner. GPUI draws through DirectX on Windows and the
# icon is embedded by a Windows-only build script (launcher/build.rs, winresource), so this cannot
# be cross-compiled from Linux: the runner has to be Windows.
#
# Every run uploads the exe as an artifact (Actions -> the run -> Artifacts). Tagged runs also
# attach it to the release.
on:
  push:
    branches: [main]
    tags: ["launcher-v*"]
  pull_request:
    paths:
      - "launcher/**"
      - "crates/**"
      - ".github/workflows/launcher-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: launcher-exe-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
          shared-key: launcher-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the launcher
        working-directory: launcher
        run: cargo build --release --locked --bin claudium-launcher
      - name: Collect it
        shell: bash
        run: |
          mkdir -p dist
          cp launcher/target/release/claudium-launcher.exe dist/
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: claudium-launcher-windows
          path: dist/claudium-launcher.exe
          if-no-files-found: error
      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/claudium-launcher.exe
          generate_release_notes: true
