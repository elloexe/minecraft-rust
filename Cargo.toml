[package]
name = "claudium"
version = "0.1.0"
edition = "2024"
description = "An open-source Minecraft client written from scratch in Rust, compatible with Minecraft: Java Edition servers (26.x). Not affiliated with Mojang."
license = "MIT OR Apache-2.0"

[dependencies]
wgpu = "25"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.29", features = ["bytemuck"] }
anyhow = "1"
# networking
flate2 = "1"
aes = "0.8"
rsa = "0.9"
sha1 = "0.10"
num-bigint = "0.4"
rand = "0.8"
serde_json = "1"
ureq = { version = "2", features = ["json"] }
# reading the player's own game files
zip = { version = "2", default-features = false, features = ["deflate"] }
png = "0.17"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
