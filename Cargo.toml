[workspace]
exclude = ["launcher", "crates/claudium-telemetry-server", "crates/claudium-mod-registry", "third_party/wgpu-hal"]
members = [
    "crates/claudium-core",
    "crates/claudium-dualsense",
    "crates/claudium-threads",
    "crates/claudium-hdr",
    "crates/claudium-world",
    "crates/claudium-client",
    "crates/claudium-client-core",
    "crates/claudium-client-input",
    "crates/claudium-client-render",
    "crates/claudium-command",
    "crates/claudium-items",
    "crates/claudium-server-files",
    "crates/claudium-anticheat",
    "crates/claudium-server",
    "crates/claudium-bots",
    "crates/claudium-assets",
    "crates/claudium-protocol",
    "crates/claudium-theme",
    "crates/claudium-prepare",
    "crates/claudium-telemetry",
    "crates/claudium-bench",
    "crates/claudium-friends",
    "crates/claudium-relay",
    "crates/claudium-mods",
    "crates/cargo-claudium-mod",
    "crates/claudium-port-pack",
    "crates/claudium-shaders",
    "crates/claudium-shader-api",
    "crates/claudium-release-sign",
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

# Ports mirror vanilla's Java signatures, index loops and nested generic types
# one to one so they can be checked against the decompiled sources.
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"
# `a < lo || a > hi` is how the Java reads, and unlike `!(lo..=hi).contains(&a)` it stays false
# for NaN. Rewriting it would change behaviour in ported float code (dragon flight, aquifers).
manual_range_contains = "allow"

# wgpu-hal 30.0.1 with gfx-rs/wgpu#10124: wgpu 30 creates a Vulkan descriptor
# pool with no pool sizes while it creates the device, which Vulkan allows only
# since 1.3.215, and Intel's Windows driver for 6th-10th gen iGPUs (HD 520/530,
# UHD 620/630) crashes on it with an access violation (#746). It also fixes the
# Metal backend's lookup of the CoreGraphics HDR colour space names, which handed
# CoreGraphics a symbol's address as the string and crashed HDR output on macOS.
# Drop this and the folder once a wgpu release has both fixes.
[patch.crates-io]
wgpu-hal = { path = "third_party/wgpu-hal" }

# Line tables keep file:line in backtraces; full debug info made every
# example and test binary hundreds of megabytes and slow to link.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1

# Optimized but quick-to-link builds for iteration: cargo build --profile fast
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
